  <path d="M-50,620
    L0,610 L10,590 L20,610 L30,600 L40,580 L50,600 L60,610 L80,595 L90,570 L100,595
    L110,610 L130,590 L140,570 L150,590 L160,600 L180,585 L190,560 L200,585 L210,600
    L230,580 L240,560 L250,580 L260,595 L280,575 L290,555 L300,575 L310,590
    L330,570 L340,550 L350,570 L360,585 L380,565 L390,545 L400,565 L410,580
    L430,560 L440,540 L450,560 L460,575 L480,555 L490,535 L500,555 L510,570
    L530,550 L540,530 L550,550 L560,565 L580,545 L590,525 L600,545 L610,560
    L630,540 L640,520 L650,540 L660,555 L680,535 L690,515 L700,535 L710,550
    L730,530 L740,510 L750,530 L760,548 L780,528 L790,508 L800,528 L810,545
    L830,525 L840,505 L850,525 L860,542 L880,522 L890,502 L900,522 L910,540
    L930,520 L940,500 L950,520 L960,538 L980,518 L990,498 L1000,518 L1010,535
    L1030,515 L1040,495 L1050,515 L1060,530 L1080,510 L1090,490 L1100,510 L1110,528
    L1130,508 L1140,488 L1150,508 L1160,525 L1180,505 L1190,485 L1200,505 L1210,522
    L1230,502 L1240,482 L1250,502 L1260,518 L1280,498 L1290,480 L1300,500 L1310,515
    L1330,498 L1340,478 L1350,498 L1360,512 L1380,495 L1390,475 L1400,495 L1410,510
    L1430,495 L1440,478 L1450,495 L1460,510 L1480,498 L1490,480 L1500,498 L1510,512
    L1530,498 L1540,482 L1550,498 L1560,510 L1580,500 L1590,485 L1600,500
    L1700,520 L1700,700 L-50,700 Z" fill="url(#midForest)" opacity="0.9"/>

  <!-- Lake/water -->
  <path d="M-50,700 L-50,760 L1700,760 L1700,700
    L1600,695 L1500,700 L1400,692 L1300,698 L1200,690 L1100,696 L1000,688
    L900,694 L800,686 L700,692 L600,684 L500,690 L400,682 L300,688 L200,680
    L100,686 L0,695 Z" fill="url(#water)" opacity="0.7"/>

  <!-- Water reflections -->
  <line x1="100" y1="720" x2="250" y2="720" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="400" y1="730" x2="500" y2="730" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="700" y1="715" x2="900" y2="715" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <line x1="1000" y1="725" x2="1100" y2="725" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="1250" y1="735" x2="1400" y2="735" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <line x1="200" y1="740" x2="350" y2="740" stroke="rgba(255,255,255,0.05)" stroke-width="0.8"/>
  <line x1="850" y1="745" x2="950" y2="745" stroke="rgba(255,255,255,0.05)" stroke-width="0.8"/>

  <!-- Near forest (darkest, foreground) -->
  <path d="M-50,760
    L-20,740 L-10,710 L0,740 L10,750 L20,730 L30,700 L40,730 L50,745
    L60,725 L70,690 L80,725 L90,740 L100,720 L110,685 L120,720 L130,738
    L140,715 L150,680 L160,715 L170,735 L180,712 L190,675 L200,710 L210,730
    L220,708 L230,670 L240,705 L250,728 L260,705 L270,668 L280,702 L290,725
    L300,700 L310,665 L320,698 L330,720 L340,695 L350,660 L360,695 L370,718
    L380,692 L390,658 L400,690 L410,715 L420,688 L430,655 L440,688 L450,712
    L460,686 L470,652 L480,685 L490,710 L500,682 L510,648 L520,682 L530,706
