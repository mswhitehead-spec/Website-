<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2a3a"/>
      <stop offset="25%" stop-color="#2a4a5a"/>
      <stop offset="50%" stop-color="#4a7a8a"/>
      <stop offset="75%" stop-color="#6a9aaa"/>
      <stop offset="100%" stop-color="#8ab0b8"/>
    </linearGradient>
    <!-- Sun glow -->
    <radialGradient id="sunGlow" cx="75%" cy="55%" r="30%">
      <stop offset="0%" stop-color="rgba(255,200,120,0.4)"/>
      <stop offset="50%" stop-color="rgba(255,180,100,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,160,80,0)"/>
    </radialGradient>
    <!-- Haze -->
    <linearGradient id="haze" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(180,200,210,0.5)"/>
      <stop offset="40%" stop-color="rgba(180,200,210,0.15)"/>
      <stop offset="100%" stop-color="rgba(180,200,210,0)"/>
    </linearGradient>
    <!-- Forest gradients -->
    <linearGradient id="farForest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a4a3a"/>
      <stop offset="100%" stop-color="#1a3a2a"/>
    </linearGradient>
    <linearGradient id="midForest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3e2a"/>
      <stop offset="100%" stop-color="#152e1e"/>
    </linearGradient>
    <linearGradient id="nearForest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162e1c"/>
      <stop offset="100%" stop-color="#0e2214"/>
    </linearGradient>
    <!-- Water -->
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a8a90"/>
      <stop offset="100%" stop-color="#3a6a70"/>
    </linearGradient>
    <!-- Overlay for text readability -->
    <linearGradient id="textOverlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(15,30,20,0.45)"/>
      <stop offset="40%" stop-color="rgba(15,30,20,0.25)"/>
      <stop offset="70%" stop-color="rgba(15,30,20,0.35)"/>
      <stop offset="100%" stop-color="rgba(15,30,20,0.55)"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow -->
  <rect width="1600" height="900" fill="url(#sunGlow)"/>

  <!-- Stars/dots -->
  <circle cx="200" cy="60" r="1" fill="rgba(255,255,255,0.4)"/>
  <circle cx="450" cy="90" r="1.2" fill="rgba(255,255,255,0.3)"/>
  <circle cx="700" cy="40" r="0.8" fill="rgba(255,255,255,0.5)"/>
  <circle cx="950" cy="75" r="1" fill="rgba(255,255,255,0.3)"/>
  <circle cx="1200" cy="50" r="1.5" fill="rgba(255,255,255,0.25)"/>
  <circle cx="1400" cy="100" r="0.8" fill="rgba(255,255,255,0.35)"/>
  <circle cx="100" cy="120" r="1" fill="rgba(255,255,255,0.2)"/>
  <circle cx="350" cy="30" r="0.7" fill="rgba(255,255,255,0.4)"/>

  <!-- Far mountains (light, misty) -->
  <path d="M-50,550 L100,350 L200,420 L350,280 L450,380 L550,300 L650,360 L750,250 L850,340 L950,270 L1050,350 L1150,290 L1250,370 L1350,310 L1450,380 L1550,320 L1700,400 L1700,600 L-50,600 Z" fill="#4a7a6a" opacity="0.5"/>

  <!-- Mid-far mountains (slightly darker) -->
  <path d="M-50,580 L50,440 L150,490 L280,370 L380,430 L500,340 L620,410 L720,330 L830,400 L940,350 L1060,420 L1160,360 L1280,430 L1380,370 L1500,450 L1600,400 L1700,500 L1700,650 L-50,650 Z" fill="#3a6a5a" opacity="0.6"/>

  <!-- Snow-capped peak left -->
  <path d="M200,490 L350,300 L500,490 Z" fill="#3a6a5a" opacity="0.7"/>
  <path d="M310,360 L350,300 L390,360 Z" fill="rgba(255,255,255,0.3)"/>

  <!-- Snow-capped peak center-right -->
  <path d="M900,500 L1100,280 L1300,500 Z" fill="#3a6a5a" opacity="0.7"/>
  <path d="M1040,350 L1100,280 L1160,350 Z" fill="rgba(255,255,255,0.35)"/>
  <path d="M1060,370 L1100,280 L1080,340 Z" fill="rgba(255,255,255,0.2)"/>

  <!-- Atmospheric haze -->
  <rect y="400" width="1600" height="500" fill="url(#haze)"/>

  <!-- Mid hills with forest -->
  <path d="M-50,650 L100,550 L250,590 L400,520 L550,570 L700,510 L850,560 L1000,500 L1150,550 L1300,510 L1450,560 L1600,520 L1700,580 L1700,700 L-50,700 Z" fill="url(#farForest)"/>

