    L1340,625 L1350,595 L1360,628 L1370,650 L1380,622 L1390,592 L1400,625 L1410,648
    L1420,620 L1430,590 L1440,622 L1450,645 L1460,618 L1470,588 L1480,620 L1490,642
    L1500,615 L1510,586 L1520,618 L1530,640 L1540,612 L1550,584 L1560,615 L1570,638
    L1580,610 L1590,582 L1600,612
    L1700,650 L1700,900 L-50,900 Z" fill="url(#nearForest)"/>

  <!-- Ground/trail area -->
  <path d="M-50,830 Q200,810 400,820 Q600,830 800,815 Q1000,800 1200,815 Q1400,825 1600,810 L1700,810 L1700,900 L-50,900 Z" fill="#0e2214"/>

  <!-- Trail/path hint -->
  <path d="M700,900 Q720,850 780,820 Q850,790 950,780 Q1050,775 1100,790" fill="none" stroke="rgba(180,160,130,0.12)" stroke-width="20" stroke-linecap="round"/>

  <!-- Overlay for text legibility -->
  <rect width="1600" height="900" fill="url(#textOverlay)"/>

  <!-- Subtle vignette -->
  <rect width="1600" height="900" fill="url(#textOverlay)" opacity="0.3"/>
</svg>
